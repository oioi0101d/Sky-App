<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SKY BIRD</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050817;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;
    pointer-events:auto;
}

#menu{
    background:linear-gradient(#091331,#101c43);
    overflow-y:auto;
    padding:20px;
}

.title{
    font-size:clamp(42px,9vw,90px);
    font-weight:900;
    color:white;
    text-shadow:
        0 5px 0 #3146a0,
        0 0 20px #6fa8ff;
    margin:5px 0 12px;
}

.subtitle{
    color:#b8c9ff;
    font-size:18px;
    margin-bottom:15px;
}

button{
    border:0;
    border-radius:16px;
    padding:13px 22px;
    margin:5px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#fff;
    color:#111;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 rgba(0,0,0,.3);
}

.play{
    background:#56e27b;
    min-width:180px;
    font-size:25px;
}

.info{
    color:white;
    font-size:17px;
    margin:8px;
}

#skins{
    width:min(1050px,100%);
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-top:8px;
}

.skin{
    min-width:125px;
    background:#182451;
    color:white;
    border:2px solid #354a8b;
    box-shadow:none;
}

.skin.selected{
    background:#3558bb;
    border-color:#8db2ff;
}

.skin.locked{
    opacity:.55;
}

#score,
#coinHud{
    position:fixed;
    top:12px;
    z-index:5;
    color:white;
    font-weight:900;
    text-shadow:0 3px 4px #000;
    pointer-events:none;
}

#score{
    left:18px;
    font-size:32px;
}

#coinHud{
    right:18px;
    font-size:25px;
}

#gameOver{
    display:none;
    background:rgba(0,0,20,.72);
    backdrop-filter:blur(5px);
}

#gameOver h2{
    color:white;
    font-size:50px;
    margin:5px;
    text-shadow:0 4px 0 #111;
}

#gameOver p{
    color:white;
    font-size:22px;
}

.small{
    color:#b9c5ed;
    font-size:14px;
    margin-top:8px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu" class="screen">

    <div class="title">SKY BIRD</div>

    <div class="subtitle">
        Voe, pegue moedas e não encoste nas nuvens fatais!
    </div>

    <button class="play" onclick="startGame()">▶ JOGAR</button>

    <div class="info">
        🏆 Recorde: <span id="bestText">0</span>
        &nbsp;&nbsp;
        🪙 Moedas: <span id="coinsText">0</span>
    </div>

    <h2 style="color:white;margin:15px 0 5px;">SKINS</h2>

    <div id="skins"></div>

    <div class="small">
        Toque na tela para o pássaro voar.
    </div>
</div>

<div id="score">0</div>
<div id="coinHud">🪙 0</div>

<div id="gameOver" class="screen">

    <h2>💥 GAME OVER</h2>

    <p>
        Pontuação: <b id="finalScore">0</b>
    </p>

    <p>
        🪙 Moedas: <b id="finalCoins">0</b>
    </p>

    <button class="play" onclick="startGame()">🔄 JOGAR DE NOVO</button>
    <button onclick="showMenu()">🏠 MENU</button>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

const skins = [
    {name:"🐦 Comum", price:0},
    {name:"🦸 Herói", price:100},
    {name:"🔥 Fênix", price:300},
    {name:"🤖 Robô", price:500},
    {name:"👽 Alien", price:1000},
    {name:"🌑 Sombrio", price:2000},
    {name:"🍩 Rosquinha", price:2500},
    {name:"🧇 Waffle", price:3000},
    {name:"🎅 Natal", price:200},
    {name:"🎃 Halloween", price:200},
    {name:"🥳 Ano Novo", price:200},
    {name:"🦔 Sonic", price:1000}
];

let totalCoins = Number(localStorage.getItem("skyCoins") || 0);
let best = Number(localStorage.getItem("skyBest") || 0);
let selectedSkin = Number(localStorage.getItem("skySkin") || 0);

let bought = JSON.parse(
    localStorage.getItem("skyBought") || "[true]"
);

for(let i=0;i<skins.length;i++){
    if(bought[i] === undefined){
        bought[i] = i === 0;
    }
}

function saveData(){
    localStorage.setItem("skyCoins",totalCoins);
    localStorage.setItem("skyBest",best);
    localStorage.setItem("skySkin",selectedSkin);
    localStorage.setItem("skyBought",JSON.stringify(bought));
}

function updateTexts(){
    document.getElementById("bestText").textContent = best;
    document.getElementById("coinsText").textContent = totalCoins;
}

function createSkinButtons(){

    const box = document.getElementById("skins");
    box.innerHTML = "";

    skins.forEach((skin,i)=>{

        const b = document.createElement("button");

        b.className = "skin";

        if(selectedSkin === i){
            b.classList.add("selected");
        }

        if(!bought[i]){
            b.classList.add("locked");
        }

        if(bought[i]){
            b.textContent = skin.name;
        }else{
            b.textContent = skin.name+" • 🪙 "+skin.price;
        }

        b.onclick = ()=>{

            if(bought[i]){
                selectedSkin = i;
                saveData();
                createSkinButtons();
                return;
            }

            if(totalCoins >= skin.price){

                totalCoins -= skin.price;
                bought[i] = true;
                selectedSkin = i;

                saveData();

                updateTexts();
                createSkinButtons();
            }
        };

        box.appendChild(b);
    });
}

updateTexts();
createSkinButtons();

let running = false;
let gameTime = 0;
let lastTime = 0;

let bird = {
    x:0,
    y:0,
    velocity:0,
    radius:22
};

let normalClouds = [];
let fatalClouds = [];
let lowFatalClouds = [];
let coins = [];

let cloudTimer = 0;
let fatalTimer = 0;
let lowFatalTimer = 0;
let coinTimer = 0;

let collectedCoins = 0;

function resetGame(){

    bird.x = W * .22;
    bird.y = H * .45;
    bird.velocity = 0;

    normalClouds = [];
    fatalClouds = [];
    lowFatalClouds = [];
    coins = [];

    cloudTimer = .2;
    fatalTimer = .8;
    lowFatalTimer = 1.2;
    coinTimer = 1;

    gameTime = 0;
    collectedCoins = 0;

    document.getElementById("score").textContent = "0";
    document.getElementById("coinHud").textContent = "🪙 0";
}

function flap(){

    if(!running) return;

    bird.velocity = -390;
}

function startGame(){

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    document.getElementById("score").style.display = "block";
    document.getElementById("coinHud").style.display = "block";

    resetGame();

    running = true;
    lastTime = performance.now();

    requestAnimationFrame(loop);
}

function showMenu(){

    running = false;

    document.getElementById("gameOver").style.display = "none";
    document.getElementById("menu").style.display = "flex";

    document.getElementById("score").style.display = "none";
    document.getElementById("coinHud").style.display = "none";

    updateTexts();
    createSkinButtons();
}

function gameOver(){

    if(!running) return;

    running = false;

    const score = Math.floor(gameTime*5);

    if(score > best){
        best = score;
    }

    totalCoins += collectedCoins;

    saveData();

    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalCoins").textContent = collectedCoins;

    document.getElementById("gameOver").style.display = "flex";

    document.getElementById("score").style.display = "none";
    document.getElementById("coinHud").style.display = "none";

    updateTexts();
}

function createNormalCloud(){

    normalClouds.push({

        x:W+100,

        y:
            70 +
            Math.random() *
            Math.max(100,H*.60),

        size:25+Math.random()*20,

        speed:45+Math.random()*25
    });
}

function createFatalCloud(){

    /*
       Agora as nuvens fatais podem aparecer em
       praticamente toda a altura da tela.
       Isso evita uma área segura embaixo.
    */

    let y;

    if(Math.random() < .45){

        const bottomRange = Math.min(180,H*.35);

        y = Math.max(
            70,
            H - 80 - Math.random()*bottomRange
        );

    }else{

        y =
            70 +
            Math.random() *
            Math.max(100,H*.60);
    }

    fatalClouds.push({

        x:W+120,

        y:y,

        size:38+Math.random()*12,

        speed:90+Math.random()*30,

        pulse:Math.random()*10
    });
}

/*
    NUVENS FATAIS EXTRAS NA PARTE DE BAIXO

    Essas são as que impedem o jogador de ficar
    simplesmente voando no fundo da tela quando
    estiver jogando em pé.
*/
function createLowFatalCloud(){

    const range = Math.min(150,H*.28);

    lowFatalClouds.push({

        x:W+140,

        y:Math.max(
            70,
            H - 75 - Math.random()*range
        ),

        size:38+Math.random()*14,

        speed:100+Math.random()*40,

        pulse:Math.random()*10
    });
}

function createCoin(){

    coins.push({

        x:W+50,

        y:
            70 +
            Math.random() *
            Math.max(100,H*.62),

        radius:15,

        speed:75+Math.random()*35,

        rotation:0
    });
}

function circleCollision(a,b){

    const dx = a.x-b.x;
    const dy = a.y-b.y;

    const distance = Math.sqrt(dx*dx+dy*dy);

    return distance < a.radius+b.size*.7;
}

function update(dt){

    gameTime += dt;

    /*
        GRAVIDADE
    */
    bird.velocity += 1150*dt;
    bird.y += bird.velocity*dt;

    /*
        NUVENS NORMAIS
    */
    cloudTimer -= dt;

    if(cloudTimer <= 0){

        createNormalCloud();

        cloudTimer =
            .8 +
            Math.random()*1.1;
    }

    for(const cloud of normalClouds){

        cloud.x -= cloud.speed*dt;
    }

    normalClouds =
        normalClouds.filter(
            cloud => cloud.x > -150
        );

    /*
        NUVENS FATAIS
    */
    fatalTimer -= dt;

    if(fatalTimer <= 0){

        createFatalCloud();

        fatalTimer =
            1.2 +
            Math.random()*1.3;
    }

    for(const cloud of fatalClouds){

        cloud.x -= cloud.speed*dt;

        cloud.pulse += dt*5;

        if(circleCollision(bird,cloud)){
            gameOver();
            return;
        }
    }

    fatalClouds =
        fatalClouds.filter(
            cloud => cloud.x > -170
        );

    /*
        NUVENS FATAIS BAIXAS
    */
    lowFatalTimer -= dt;

    if(lowFatalTimer <= 0){

        createLowFatalCloud();

        /*
            Aparecem com frequência suficiente
            para não deixar a parte de baixo segura.
        */
        lowFatalTimer =
            1.25 +
            Math.random()*1.15;
    }

    for(const cloud of lowFatalClouds){

        cloud.x -= cloud.speed*dt;

        cloud.pulse += dt*5;

        if(circleCollision(bird,cloud)){
            gameOver();
            return;
        }
    }

    lowFatalClouds =
        lowFatalClouds.filter(
            cloud => cloud.x > -170
        );

    /*
        MOEDAS
    */
    coinTimer -= dt;

    if(coinTimer <= 0){

        createCoin();

        coinTimer =
            1.1 +
            Math.random()*1.2;
    }

    for(const coin of coins){

        coin.x -= coin.speed*dt;
        coin.rotation += dt*5;

        const dx = bird.x-coin.x;
        const dy = bird.y-coin.y;

        if(
            Math.sqrt(dx*dx+dy*dy)
            <
            bird.radius+coin.radius
        ){

            coin.collected = true;

            collectedCoins++;
        }
    }

    coins =
        coins.filter(
            coin =>
                !coin.collected &&
                coin.x > -50
        );

    /*
        LIMITES DA TELA
    */
    if(
        bird.y-bird.radius < 0 ||
        bird.y+bird.radius > H-45
    ){

        gameOver();
        return;
    }

    const score =
        Math.floor(gameTime*5);

    document.getElementById("score")
        .textContent = score;

    document.getElementById("coinHud")
        .textContent =
            "🪙 " + collectedCoins;
}

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#07102d"
    );

    gradient.addColorStop(
        .55,
        "#172b65"
    );

    gradient.addColorStop(
        1,
        "#314c8b"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,0,W,H
    );

    /*
        ESTRELAS
    */
    ctx.fillStyle = "white";

    for(let i=0;i<70;i++){

        const x =
            (i*137)%W;

        const y =
            (i*71)%
            Math.max(100,H*.7);

        const size =
            i%5===0 ? 2 : 1;

        ctx.globalAlpha =
            .3+(i%4)*.15;

        ctx.fillRect(
            x,
            y,
            size,
            size
        );
    }

    ctx.globalAlpha = 1;

    /*
        LUA
    */
    ctx.fillStyle = "#f7f1c5";

    ctx.beginPath();

    ctx.arc(
        W*.82,
        Math.max(70,H*.16),
        Math.min(45,W*.06),
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#07102d";

    ctx.beginPath();

    ctx.arc(
        W*.84,
        Math.max(60,H*.14),
        Math.min(40,W*.055),
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        CHÃO
    */
    ctx.fillStyle = "#172b23";

    ctx.fillRect(
        0,
        H-45,
        W,
        45
    );

    ctx.fillStyle = "#274632";

    ctx.fillRect(
        0,
        H-45,
        W,
        7
    );
}

function drawNormalCloud(cloud){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y
    );

    ctx.fillStyle =
        "rgba(235,245,255,.88)";

    ctx.beginPath();

    ctx.arc(
        -cloud.size*.45,
        5,
        cloud.size*.42,
        0,
        Math.PI*2
    );

    ctx.arc(
        0,
        -cloud.size*.12,
        cloud.size*.55,
        0,
        Math.PI*2
    );

    ctx.arc(
        cloud.size*.48,
        7,
        cloud.size*.38,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        -cloud.size*.65,
        5,
        cloud.size*1.3,
        cloud.size*.35
    );

    ctx.restore();
}

function drawFatalCloud(cloud){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y
    );

    const pulse =
        Math.sin(cloud.pulse)*2;

    ctx.fillStyle =
        "#727c92";

    ctx.beginPath();

    ctx.arc(
        -cloud.size*.45,
        5,
        cloud.size*.42+pulse,
        0,
        Math.PI*2
    );

    ctx.arc(
        0,
        -cloud.size*.12,
        cloud.size*.55+pulse,
        0,
        Math.PI*2
    );

    ctx.arc(
        cloud.size*.48,
        7,
        cloud.size*.38+pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        -cloud.size*.65,
        5,
        cloud.size*1.3,
        cloud.size*.35
    );

    /*
        OLHOS FATAIS
    */
    ctx.fillStyle = "#ff3131";

    ctx.beginPath();

    ctx.arc(
        -cloud.size*.2,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        cloud.size*.2,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#421313";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        -cloud.size*.32,
        cloud.size*.2
    );

    ctx.lineTo(
        cloud.size*.32,
        cloud.size*.2
    );

    ctx.stroke();

    ctx.restore();
}

function drawCoin(coin){

    ctx.save();

    ctx.translate(
        coin.x,
        coin.y
    );

    const scale =
        Math.abs(
            Math.cos(coin.rotation)
        );

    ctx.scale(
        Math.max(.2,scale),
        1
    );

    ctx.fillStyle =
        "#ffd83d";

    ctx.strokeStyle =
        "#d99b00";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle =
        "#fff3a1";

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "$",
        0,
        1
    );

    ctx.restore();
}

function drawBird(){

    ctx.save();

    ctx.translate(
        bird.x,
        bird.y
    );

    /*
        inclinação
    */
    ctx.rotate(
        Math.max(
            -.45,
            Math.min(
                .65,
                bird.velocity/700
            )
        )
    );

    let bodyColor = "#f5f5f5";
    let wingColor = "#d5d5d5";
    let beakColor = "#ffad22";

    switch(selectedSkin){

        case 0:
            bodyColor="#f5f5f5";
            wingColor="#d5d5d5";
            break;

        case 1:
            bodyColor="#4aa3ff";
            wingColor="#1d5fc2";
            break;

        case 2:
            bodyColor="#ff6b21";
            wingColor="#ffcc22";
            break;

        case 3:
            bodyColor="#9ba4b5";
            wingColor="#596273";
            break;

        case 4:
            bodyColor="#79ff78";
            wingColor="#2cbd46";
            break;

        case 5:
            bodyColor="#252536";
            wingColor="#11111b";
            break;

        case 6:
            bodyColor="#d98b4a";
            wingColor="#f2b46e";
            break;

        case 7:
            bodyColor="#d49b5d";
            wingColor="#9a6b39";
            break;

        case 8:
            bodyColor="#fff";
            wingColor="#e33";
            break;

        case 9:
            bodyColor="#ff8b22";
            wingColor="#202020";
            break;

        case 10:
            bodyColor="#ffd94a";
            wingColor="#ff5757";
            break;

        case 11:
            bodyColor="#1685ff";
            wingColor="#0860c7";
            break;
    }

    /*
        CORPO
    */
    ctx.fillStyle = bodyColor;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        bird.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        ASA
    */
    ctx.fillStyle = wingColor;

    ctx.beginPath();

    ctx.ellipse(
        -8,
        8,
        15,
        8,
        -.35,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        BICO
    */
    ctx.fillStyle = beakColor;

    ctx.beginPath();

    ctx.moveTo(
        bird.radius-2,
        -2
    );

    ctx.lineTo(
        bird.radius+17,
        5
    );

    ctx.lineTo(
        bird.radius-2,
        10
    );

    ctx.closePath();

    ctx.fill();

    /*
        OLHO
    */
    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        9,
        -8,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        11,
        -8,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        DETALHES DAS SKINS
    */

    if(selectedSkin === 1){

        ctx.fillStyle="#e33";

        ctx.beginPath();

        ctx.moveTo(-15,-15);
        ctx.lineTo(0,-28);
        ctx.lineTo(15,-15);

        ctx.closePath();

        ctx.fill();
    }

    if(selectedSkin === 2){

        ctx.fillStyle="#ffe400";

        ctx.beginPath();

        ctx.arc(
            -3,
            -20,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(selectedSkin === 3){

        ctx.strokeStyle="#222";
        ctx.lineWidth=3;

        ctx.strokeRect(
            4,
            -13,
            15,
            9
        );
    }

    if(selectedSkin === 4){

        ctx.fillStyle="#72ffff";

        ctx.beginPath();

        ctx.arc(
            -8,
            -17,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(selectedSkin === 5){

        ctx.strokeStyle="#913cff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            bird.radius+3,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(selectedSkin === 8){

        ctx.fillStyle="#fff";

        ctx.fillRect(
            -12,
            -27,
            24,
            7
        );
    }

    if(selectedSkin === 9){

        ctx.fillStyle="#202020";

        ctx.beginPath();

        ctx.arc(
            -10,
            8,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(selectedSkin === 10){

        ctx.fillStyle="#ff5757";

        ctx.fillRect(
            -14,
            -28,
            5,
            12
        );

        ctx.fillStyle="#4cff6a";

        ctx.fillRect(
            -4,
            -30,
            5,
            14
        );

        ctx.fillStyle="#4b8cff";

        ctx.fillRect(
            6,
            -27,
            5,
            11
        );
    }

    if(selectedSkin === 11){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.moveTo(
            -20,
            -4
        );

        ctx.lineTo(
            -35,
            5
        );

        ctx.lineTo(
            -20,
            8
        );

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}

function draw(){

    drawBackground();

    for(const cloud of normalClouds){
        drawNormalCloud(cloud);
    }

    for(const cloud of fatalClouds){
        drawFatalCloud(cloud);
    }

    for(const cloud of lowFatalClouds){
        drawFatalCloud(cloud);
    }

    for(const coin of coins){
        drawCoin(coin);
    }

    drawBird();
}

function loop(now){

    if(!running) return;

    let dt =
        (now-lastTime)/1000;

    lastTime = now;

    dt =
        Math.min(
            dt,
            .035
        );

    update(dt);
    draw();

    if(running){
        requestAnimationFrame(loop);
    }
}

/*
    CONTROLES
*/

window.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.tagName === "BUTTON"
        ){
            return;
        }

        flap();
    }
);

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            flap();
        }
    }
);

/*
    Impede o menu de criar scroll estranho
    durante o jogo.
*/
window.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);

/*
    Inicialização
*/
document.getElementById("score").style.display="none";
document.getElementById("coinHud").style.display="none";

drawBackground();
drawBird();
</script>
